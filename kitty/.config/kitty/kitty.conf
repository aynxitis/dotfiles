font_family        Maple Mono NF
font_size          11.5
adjust_line_height 112%

background            #1C1C1E
foreground            #E5E5E7
selection_background  #0A84FF
selection_foreground  #1C1C1E
cursor                #E5E5E7

background_opacity         1.0
dynamic_background_opacity yes

window_padding_width    7
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no
scrollback_lines        10000

cursor_trail            3

# Never save/restore window size or state. A saved "maximized" state made
# every new kitty ask Hyprland to maximize over its neighbours.
remember_window_size    no
