backend      = "glx";
vsync        = true;
use-damage   = true;
repaint-delay = 0;

corner-radius = 10;

shadow          = true;
shadow-radius   = 24;
shadow-opacity  = 0.45;
shadow-offset-x = -24;
shadow-offset-y = -18;

blur-method     = "dual_kawase";
blur-strength   = 5;
blur-background = false;

fading = false;

detect-rounded-corners = true;
detect-client-opacity  = true;

rules = (
  { match = "window_type = 'dock'";
    blur-background = true; shadow = false; corner-radius = 0; },

  { match = "window_type = 'desktop'";
    shadow = false; corner-radius = 0; },

  { match = "fullscreen";
    shadow = false; corner-radius = 0; },

  { match = "class_g = 'i3-frame'"; shadow = false; },

  { match = "class_g = 'Rofi'";
    blur-background = true; corner-radius = 12; },

  { match = "class_g = 'Dunst'"; corner-radius = 10; }
);
