# Read by /usr/bin/spotify, one flag per line. Lines starting with # are ignored.
#
# Spotify is CEF (not Electron), so ELECTRON_OZONE_PLATFORM_HINT does not
# reach it -- flags have to come through here.
#
# Without --disable-gpu it dies at startup on this i915 laptop with:
#   FATAL:gpu_data_manager_impl_private.cc:417] GPU process isn't usable. Goodbye.
# The ozone flags alone do NOT fix that; --disable-gpu is the load-bearing one.
#
# With the ozone flags it runs as a native Wayland client and reports its
# window class as "spotify" (lowercase). Drop the two ozone lines and it runs
# under XWayland instead and reports "Spotify" -- if you change this, update
# the class in hypr/.config/hypr/rules.lua to match.
--enable-features=UseOzonePlatform
--ozone-platform=wayland
--disable-gpu
