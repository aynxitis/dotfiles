# GTK settings for Waybar ONLY. Waybar is launched with XDG_CONFIG_HOME
# pointed here (see hypr/autostart.lua) so its tray uses a LIGHT icon theme,
# because the bar has light glass pills and Papirus-Dark panel icons are
# near-white (#dfdfdf) and wash out. System-wide theming is untouched:
# ~/.config/gtk-3.0/settings.ini still says Papirus-Dark.

[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus-Light
gtk-font-name=Inter 10
gtk-cursor-theme-name=macOS
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
gtk-toolbar-style=GTK_TOOLBAR_BOTH_HORIZ
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintmedium
