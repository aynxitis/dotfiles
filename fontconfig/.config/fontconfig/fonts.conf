<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Generic family aliases.

  Without this, fc-match resolved sans-serif to Verdana and monospace to
  Andale Mono, because the Microsoft core fonts outrank everything else in
  the default ordering. Anything asking for a generic family - GTK apps with
  no explicit font, web content, rofi fallbacks - got Verdana.
-->
<fontconfig>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>

  <!-- some toolkits ask for "sans" rather than "sans-serif" -->
  <alias>
    <family>sans</family>
    <prefer><family>Inter</family></prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>

  <alias>
    <family>mono</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>

</fontconfig>
