# Adapted from RafikW19's My-Dotfiles: blurred screenshot, round avatar,
# big clock, date, password field. Their disable_loading_bar and the old
# grace/no_fade_in keys are not general: options in hyprlock 0.9.

general {
    hide_cursor = true
    ignore_empty_input = false
}

animations {
    enabled = true

    bezier = linear, 0, 0, 1, 1

    # speed is in deciseconds: 1.5 = 0.15s. hyprlock rejects speeds below 1.
    animation = fadeIn, 1, 1.5, linear
    animation = fadeOut, 1, 1.5, linear
}

# Static gradient, shown as-is with no blur.
background {
    monitor =
    path = ~/Pictures/Wallpapers/lock-gradient.png
    blur_passes = 0
}

# Avatar
image {
    monitor =
    path = ~/Pictures/Wallpapers/avatar.jpeg
    size = 180
    rounding = -1
    border_size = 3

    halign = center
    valign = center
    position = 0, 180
}

# Large clock
label {
    monitor =
    text = $TIME

    font_family = JetBrainsMono Nerd Font
    font_size = 100
    color = rgba(255, 255, 255, 1.0)

    halign = center
    valign = center
    position = 0, 10
}

# Date below the clock
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"

    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = rgba(230, 230, 240, 0.85)

    halign = center
    valign = center
    position = 0, -80
}

# Password field
input-field {
    monitor =
    size = 260, 48
    outline_thickness = 2

    dots_size = 0.12
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(20, 20, 25, 0.55)
    font_color = rgba(255, 255, 255, 1.0)

    rounding = 24

    fade_on_empty = false
    placeholder_text =

    halign = center
    valign = center
    position = 0, -180
}
