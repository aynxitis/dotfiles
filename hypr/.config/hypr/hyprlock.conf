# Big clock
label {
    monitor =
    text = cmd[update:30000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 240
    halign = center
    valign = center
}

# Date under the clock
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/lock-gradient.png
    blur_passes = 0
    noise = 0.02
}

# Avatar image
image {
    monitor =
    path = ~/Pictures/Wallpapers/avatar.jpeg
    size = 150
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.6)
    rotate = 0
    reload_time = -1
    position = 0, -130
    halign = center
    valign = center
}

# Password input field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    outer_color = rgba(255, 255, 255, 0.4)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = true
    fade_timeout = 1500
    hide_input = false
    position = 0, -270
    halign = center
    valign = center
}
